# Rosebud Cloud —— Render 一键部署清单
# 用法：在 Render 里 New > Blueprint，连接本仓库后自动读取本文件。
# 更简单的做法：New > Web Service > 选本仓库，runtime 选 Python，Start Command 填 python server.py。

services:
  - type: web
    name: rosebud-cloud
    runtime: python
    plan: free
    startCommand: python server.py
    healthCheckPath: /
    # ⚠️ 免费实例没有持久磁盘：重启 / 重新部署会丢数据（账户 + 存档全没）。
    #    要持久化，把 plan 改为 starter（或更高），并启用下面的 disk 块：
    # disk:
    #   name: rosebud-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
    envVars:
      # 以下 4 个 key 在首次部署时由 Render 面板提示填写（sync: false = 不入仓库）
      - key: SENSENOVA_API_KEY   # AI key，只存服务端，绝不入仓库/前端
        sync: false
      - key: ADMIN_EMAIL         # 管理员邮箱（首次启动自动建管理员账号）
        sync: false
      - key: ADMIN_PASSWORD      # 管理员密码
        sync: false
      - key: INVITE_CODES        # 可选：预置邀请码，逗号分隔，如 CODE1,CODE2
        sync: false
      - key: TZ
        value: Asia/Shanghai
